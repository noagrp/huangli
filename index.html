<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1208">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="黄历知识">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>黄历知识</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#090c07;
      --bg2:#11170b;
      --surface:#151c0f;
      --surface2:#1b2412;
      --text:#f5f1d8;
      --muted:#aab58a;
      --lime:#c8d65f;
      --lime-soft:#e4ec9c;
      --gold:#d7bb55;
      --border:rgba(200,214,95,.24);
      --shadow:0 14px 34px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      color:var(--text);
      font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at 12% 0%,rgba(146,165,50,.16),transparent 30rem),
        radial-gradient(circle at 92% 16%,rgba(215,187,85,.08),transparent 26rem),
        linear-gradient(180deg,var(--bg2),var(--bg));
    }
    .page{width:min(1060px,100%);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:14px}
    .mark{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;border:1px solid rgba(200,214,95,.55);background:rgba(103,119,35,.16);color:var(--lime);font-size:28px;font-weight:800}
    h1{margin:0;color:var(--lime-soft);font-size:clamp(27px,4vw,40px)}
    .sub{margin:5px 0 0;color:var(--muted);font-size:12px}
    .back{color:var(--muted);text-decoration:none;font-size:12px}
    .back:hover{color:var(--lime)}
    .search{margin:0 0 22px}
    .search input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:#0c1009;color:var(--text);font:inherit;outline:none}
    .search input:focus{border-color:rgba(200,214,95,.65)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}
    .category{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:18px;padding:17px;box-shadow:var(--shadow)}
    .category h2{margin:0;color:var(--lime-soft);font-size:18px}
    .category>p{margin:8px 0 14px;color:var(--muted);font-size:12px;line-height:1.6}
    .category.reference{box-shadow:none;background:rgba(21,28,15,.58);border-style:dashed}
    .category.reference h2{color:#c9c9a8}
    .category.reference>p{margin-bottom:0;color:#8f987a}
    .reference-badge{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;border:1px solid rgba(170,181,138,.22);color:#8f987a;font-size:11px}
    .terms{display:flex;flex-wrap:wrap;gap:8px}
    button.term{border:1px solid rgba(215,187,85,.22);background:#0e130a;color:var(--text);padding:8px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
    button.term:hover{border-color:var(--lime);color:var(--lime-soft)}
    .detail{margin:0 0 20px;background:#0d1109;border:1px solid var(--border);border-radius:18px;padding:20px;min-height:150px}
    .detail .eyebrow{color:var(--gold);font-size:12px;margin-bottom:6px}
    .detail h2{margin:0 0 8px;color:var(--lime-soft)}
    .detail p{margin:0;color:#d8ddc3;line-height:1.75;font-size:14px}
    .example{margin-top:12px;color:var(--muted);font-size:12px}
    footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:8px;color:#7f8969;font-size:11px}
    footer a{color:inherit;text-decoration:none}
    footer a:hover{color:var(--lime)}
    @media(max-width:560px){.page{padding-left:13px;padding-right:13px}.grid{grid-template-columns:1fr}.back{display:none}}
  </style>
</head>
<body>
<main class="page">
  <header>
    <div class="brand">
      <div class="mark">历</div>
      <div>
        <h1>黄历知识</h1>
        <p class="sub">宜忌 · 冲煞 · 胎神 · 十二值星 · 吉神方位</p>
      </div>
    </div>
    <a class="back" href="https://noagrp.github.io/zhong/">返回 中</a>
  </header>

  <div class="search"><input id="search" type="search" placeholder="搜索：冲、胎神、开、财神、天德、鬼宿…" aria-label="搜索黄历术语"></div>
  <section class="detail" id="detail">
    <div class="eyebrow">黄历术语</div>
    <h2>选择一个术语</h2>
    <p>点击下方项目查看解释。</p>
  </section>
  <section class="grid" id="categories"></section>

  <footer><a href="https://noagrp.github.io/wannianli/">万年历</a><span>·</span><a href="https://noagrp.github.io/zhong/">中</a></footer>
</main>
<script src="./src/huangli-engine.js"></script>
<script>
(async()=>{
  const engine = await loadHuangliEngine();
  const categoriesEl = document.getElementById('categories');
  const detailEl = document.getElementById('detail');
  const searchEl = document.getElementById('search');

  function show(term){
    if(!term) return;
    const examples = (term.examples||[]).length ? '<div class="example">例：'+term.examples.join(' · ')+'</div>' : '';
    detailEl.innerHTML = '<div class="eyebrow">'+term.categoryName+'</div><h2>'+term.name+'</h2><p>'+term.explanation+'</p>'+examples;
    detailEl.classList.add('active');
  }

  function renderCategories(){
    categoriesEl.innerHTML = engine.data.categories.map(category => {
      if(category.referenceOnly){
        return '<article class="category reference"><h2>'+category.name+'</h2><p>'+category.summary+'</p><span class="reference-badge">专题内容</span></article>';
      }
      return '<article class="category"><h2>'+category.name+'</h2><p>'+category.summary+'</p><div class="terms">'+
        (category.terms.length > 24
          ? category.terms.slice(0,18).map(term=>'<button class="term" data-term="'+term.id+'">'+term.name+'</button>').join('') +
            '<button class="term" data-expand="'+category.id+'">查看全部 '+category.terms.length+'</button>'
          : category.terms.map(term=>'<button class="term" data-term="'+term.id+'">'+term.name+'</button>').join(''))+
        '</div></article>';
    }).join('');
    categoriesEl.querySelectorAll('[data-term]').forEach(btn=>btn.addEventListener('click',()=>show(engine.getTerm(btn.dataset.term))));
    categoriesEl.querySelectorAll('[data-expand]').forEach(btn=>btn.addEventListener('click',()=>{
      const category = engine.getCategory(btn.dataset.expand);
      const article = btn.closest('.category');
      article.querySelector('.terms').innerHTML = category.terms.map(term=>'<button class="term" data-term="'+term.id+'">'+term.name+'</button>').join('');
      article.querySelectorAll('[data-term]').forEach(termBtn=>termBtn.addEventListener('click',()=>show(engine.getTerm(termBtn.dataset.term))));
    }));
  }

  function renderSearch(query){
    const results = engine.search(query);
    if(!query.trim()){ renderCategories(); return; }
    categoriesEl.innerHTML = results.length
      ? '<article class="category"><h2>搜索结果</h2><p>'+results.length+' 个相关术语</p><div class="terms">'+results.map(t=>'<button class="term" data-term="'+t.id+'">'+t.name+'</button>').join('')+'</div></article>'
      : '<article class="category"><h2>没有找到</h2><p>试试其他关键词。</p></article>';
    categoriesEl.querySelectorAll('[data-term]').forEach(btn=>btn.addEventListener('click',()=>show(engine.getTerm(btn.dataset.term))));
  }

  searchEl.addEventListener('input',()=>renderSearch(searchEl.value));
  renderCategories();
})().catch(err=>{
  console.error(err);
  document.getElementById('detail').innerHTML='<div class="eyebrow">错误</div><h2>资料载入失败</h2><p>请稍后重新载入页面。</p>';
});
</script>
</body>
</html>
